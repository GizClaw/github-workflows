name: OpenAI Issue readiness

on:
  issues:
    types: [edited, reopened, typed, untyped]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to review and use to refresh linked open PRs.
        required: true
        type: number

permissions:
  actions: write
  checks: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: openai-issue-readiness-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    outputs:
      pull_requests: ${{ steps.links.outputs.pull_requests }}
      pull_request_count: ${{ steps.links.outputs.pull_request_count }}
    steps:
      - id: links
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const data = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    closedByPullRequestsReferences(first: 50) {
                      nodes { number state }
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: Number(
                context.payload.issue?.number
                  || context.payload.inputs?.issue_number,
              ),
            });
            const pullRequests = (data.repository.issue
              ?.closedByPullRequestsReferences.nodes || [])
              .filter((pullRequest) => pullRequest.state === 'OPEN')
              .map((pullRequest) => pullRequest.number);
            core.setOutput('pull_requests', JSON.stringify(pullRequests));
            core.setOutput('pull_request_count', String(pullRequests.length));

  review_issue:
    uses: ./.github/workflows/codex-openai-issue-review.yml
    with:
      issue_number: ${{ github.event.issue.number || inputs.issue_number }}
      model: gpt-5.6-terra
      effort: medium
      issue-review-instructions: >-
        Enforce the write-issue implementation-readiness contract.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  refresh_linked_prs:
    needs: [resolve, review_issue]
    if: needs.resolve.outputs.pull_request_count != '0'
    strategy:
      fail-fast: false
      matrix:
        pull_request_number: ${{ fromJSON(needs.resolve.outputs.pull_requests) }}
    uses: ./.github/workflows/codex-openai-review.yml
    with:
      model: gpt-5.6-terra
      effort: medium
      review-instructions: >-
        Review the pull-request diff and report actionable findings.
      issue-review-instructions: >-
        Enforce the write-issue implementation-readiness contract.
      pr-readiness-instructions: >-
        Require valid PR metadata, native implementation-Issue linkage,
        Issue-plan conformance, validation evidence, and no actionable findings.
      pull_request_number: ${{ matrix.pull_request_number }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
