name: Review script tests

on:
  pull_request:
    paths:
      - .github/scripts/**
      - .github/actions/review-gate/**
      - .github/workflows/test-review-scripts.yml
      - .github/workflows/openai-pr-review-dispatch.yml
      - .github/workflows/codex-openai-review.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/actions/review-gate/**
      - .github/workflows/test-review-scripts.yml
      - .github/workflows/openai-pr-review-dispatch.yml
      - .github/workflows/codex-openai-review.yml

permissions:
  contents: read

# Exercise the same supported queue mode used by the caller before rollout.
concurrency:
  group: review-script-tests-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Binary evidence, review orchestration and readiness regression tests
        run: |
          node .github/scripts/pr-review/binary-test.mjs
          node .github/scripts/pr-review/session-artifacts-test.mjs
          node .github/scripts/pr-review/test.mjs
          node .github/scripts/pr-review/lfs-test.mjs
          node .github/scripts/pr-readiness/test.mjs
          node .github/scripts/issue-review/test.mjs
          node .github/scripts/review-request/test.mjs
          node .github/scripts/review-request/dispatch-test.mjs
          node .github/scripts/review-request/dispatch-fence-test.mjs
          node --test .github/scripts/review-gate/test.mjs
