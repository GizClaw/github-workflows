name: OpenAI PR review

on:
  workflow_call:
    inputs:
      model:
        description: OpenAI model used by Codex for this review.
        required: false
        default: gpt-5.6-terra
        type: string
      effort:
        description: Reasoning effort supplied to Codex for this review.
        required: false
        default: medium
        type: string
      codex-version:
        description: Exact Codex CLI version used so persisted sessions remain compatible.
        required: false
        default: 0.145.0
        type: string
      max-diff-bytes:
        description: Maximum complete base-to-head diff size accepted for one PR.
        required: false
        default: 1000000
        type: number
      chunk-target-bytes:
        description: Deterministic target size for each first-review or incremental diff chunk.
        required: false
        default: 180000
        type: number
      review-instructions:
        description: Additional caller-owned instructions for the review.
        required: false
        default: Review only the pull request diff. Report actionable correctness, security, regression, and test-coverage findings.
        type: string
      issue-review-instructions:
        description: Trusted caller policy for deciding whether linked Issues are implementation-ready.
        required: false
        default: Follow the trusted-base AGENTS.md hierarchy and the Issue-review documents it requires.
        type: string
      pr-readiness-instructions:
        description: Trusted caller policy for PR metadata, Issue-plan conformance, and blocking findings.
        required: false
        default: Require valid PR metadata, native implementation-Issue linkage, Issue-plan conformance, and no actionable findings.
        type: string
      pull_request_number:
        description: Optional pull request number for a workflow_dispatch caller.
        required: false
        default: ''
        type: string
      base_sha:
        description: Reserved for callers that already resolved a pull request.
        required: false
        default: ''
        type: string
      head_sha:
        description: Reserved for callers that already resolved a pull request.
        required: false
        default: ''
        type: string
    secrets:
      OPENAI_API_KEY:
        description: OpenAI API key supplied explicitly by the calling repository.
        required: true
    outputs:
      review:
        description: Structured JSON result produced by the OpenAI review job.
        value: ${{ jobs.review.outputs.review }}
      readiness:
        description: Structured PASS/FAIL readiness evidence for the reviewed PR revision.
        value: ${{ jobs.review.outputs.readiness_evidence }}

jobs:
  rerun-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Reject workflow reruns
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" -ne 1 ]; then
            echo "::error title=Workflow reruns are disabled::Create a new review request instead (for example, post a new @codex review comment). Re-running an old Actions run can discard the incremental-review checkpoint and trigger a full review."
            exit 1
          fi

  resolve:
    needs: rerun-guard
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.pr.outputs.eligible }}
      number: ${{ steps.pr.outputs.number }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      request_comment_id: ${{ steps.pr.outputs.request_comment_id }}
    steps:
      - id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REQUESTED_PULL_NUMBER: ${{ inputs.pull_request_number }}
        with:
          script: |
            const event = context.eventName;
            const requestedNumber = Number(process.env.REQUESTED_PULL_NUMBER);
            let number;
            let requestCommentId = '';
            if (Number.isSafeInteger(requestedNumber) && requestedNumber > 0) {
              number = requestedNumber;
            } else if (event === 'pull_request' || event === 'pull_request_target') {
              number = context.payload.pull_request.number;
            } else if (event === 'issue_comment') {
              if (!context.payload.issue.pull_request) return core.setOutput('eligible', 'false');
              const command = context.payload.comment.body.trim();
              if (!/^@codex(?:\s+review(?:\s+[\s\S]+)?)?\s*$/i.test(command)) return core.setOutput('eligible', 'false');
              number = context.payload.issue.number;
              requestCommentId = String(context.payload.comment.id);
            } else if (event === 'workflow_dispatch') {
              number = Number(process.env.REQUESTED_PULL_NUMBER);
            } else {
              return core.setOutput('eligible', 'false');
            }
            const { data: pr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: Number(number) });
            const sameRepository = pr.head.repo?.full_name?.toLowerCase()
              === `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const trustedBaseEvent = [
              'pull_request_target',
              'issue_comment',
              'workflow_dispatch',
            ].includes(event) || (
              Number.isSafeInteger(requestedNumber) && requestedNumber > 0
            );
            const eligible = pr.state === 'open'
              && !pr.draft
              && (sameRepository || trustedBaseEvent);
            core.setOutput('eligible', String(eligible));
            core.setOutput('number', String(pr.number));
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('request_comment_id', requestCommentId);

  start:
    needs: resolve
    if: github.run_attempt == 1 && needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      issues: write
      pull-requests: write
    outputs:
      pr_check_run_id: ${{ steps.status.outputs.pr_check_run_id }}
      issue_check_run_id: ${{ steps.status.outputs.issue_check_run_id }}
      code_check_run_id: ${{ steps.status.outputs.code_check_run_id }}
      request_reaction_id: ${{ steps.status.outputs.request_reaction_id }}
      failure_reason: ${{ steps.status.outputs.failure_reason }}
    steps:
      - name: Mark review in progress
        id: status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          REQUEST_COMMENT_ID: ${{ needs.resolve.outputs.request_comment_id }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.number }}
        with:
          script: |
            const commentId = Number(process.env.REQUEST_COMMENT_ID);
            const created = [];
            try {
              const checks = [
                {
                  key: 'pr',
                  name: 'OpenAI PR Review',
                  summary: 'OpenAI is validating PR title, body, and native closing-Issue linkage.',
                },
                {
                  key: 'issue',
                  name: 'OpenAI Issue Review',
                  summary: 'OpenAI is validating every linked Issue format, design, and implementation plan.',
                },
                {
                  key: 'code',
                  name: 'OpenAI Code Review',
                  summary: 'OpenAI is validating the changed code and conformance with the reviewed Issue plans.',
                },
              ];
              for (const check of checks) {
                const { data: checkRun } = await github.rest.checks.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: check.name,
                  head_sha: process.env.PR_HEAD_SHA,
                  status: 'in_progress',
                  started_at: new Date().toISOString(),
                  details_url: process.env.DETAILS_URL,
                  external_id: [
                    process.env.RUN_ID,
                    process.env.RUN_ATTEMPT,
                    process.env.PULL_REQUEST_NUMBER,
                    check.key,
                  ].join(':'),
                  output: {
                    title: 'Review in progress',
                    summary: [
                      check.summary,
                      `[Open the Actions run](${process.env.DETAILS_URL}).`,
                    ].join(' '),
                  },
                });
                created.push(checkRun.id);
                core.setOutput(`${check.key}_check_run_id`, String(checkRun.id));
              }

              if (Number.isSafeInteger(commentId) && commentId > 0) {
                const { data: reaction } = await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: commentId,
                  content: 'eyes',
                });
                core.setOutput('request_reaction_id', String(reaction.id));
              }
            } catch (error) {
              const detail = String(error?.message ?? error)
                .replace(/\s+/g, ' ')
                .slice(0, 500);
              core.setOutput(
                'failure_reason',
                `Could not start the review status: ${detail}`,
              );
              for (const checkRunId of created) {
                await github.rest.checks.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: checkRunId,
                  status: 'completed',
                  conclusion: 'failure',
                  completed_at: new Date().toISOString(),
                  output: {
                    title: 'Review could not start',
                    summary: detail,
                  },
                }).catch(() => {});
              }
              throw error;
            }

  review:
    needs: [resolve, start]
    if: github.run_attempt == 1 && needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    outputs:
      review: ${{ steps.run_review.outputs.review }}
      readiness_verdict: ${{ steps.evaluate_readiness.outputs.verdict }}
      readiness_evidence: ${{ steps.evaluate_readiness.outputs.evidence }}
      duration_seconds: ${{ steps.run_review.outputs.duration_seconds }}
      usage_available: ${{ steps.run_review.outputs.usage_available }}
      input_tokens: ${{ steps.run_review.outputs.input_tokens }}
      cached_input_tokens: ${{ steps.run_review.outputs.cached_input_tokens }}
      cache_write_tokens: ${{ steps.run_review.outputs.cache_write_tokens }}
      cache_hit_ratio: ${{ steps.run_review.outputs.cache_hit_ratio }}
      output_tokens: ${{ steps.run_review.outputs.output_tokens }}
      reasoning_output_tokens: ${{ steps.run_review.outputs.reasoning_output_tokens }}
      total_tokens: ${{ steps.run_review.outputs.total_tokens }}
      credits_available: ${{ steps.run_review.outputs.credits_available }}
      estimated_credits: ${{ steps.run_review.outputs.estimated_credits }}
      credit_rates_json: ${{ steps.run_review.outputs.credit_rates_json }}
      usage_json: ${{ steps.run_review.outputs.usage_json }}
      session_key: ${{ steps.prepare_diff.outputs.session_key }}
      generation_key: ${{ steps.prepare_diff.outputs.generation_key }}
      from_sha: ${{ steps.prepare_diff.outputs.from_sha }}
      review_mode: ${{ steps.prepare_diff.outputs.mode }}
      chunk_count: ${{ steps.prepare_diff.outputs.chunk_count }}
      failure_reason: >-
        ${{ steps.fetch_head.outputs.failure_reason
          || steps.context.outputs.failure_reason
          || steps.api_key.outputs.failure_reason
          || (steps.checkout.outcome == 'failure' && 'Could not check out the trusted pull-request base commit.')
          || steps.prepare_diff.outputs.failure_reason
          || (steps.prepare_diff.outcome == 'failure' && 'Could not prepare the deterministic pull-request diff listing.')
          || (steps.codex_bootstrap.outcome == 'failure' && 'Could not start the protected Codex review runtime.')
          || steps.run_review.outputs.failure_reason
          || (steps.run_review.outcome == 'failure' && 'Codex failed before it completed the requested diff generation.')
          || (steps.evaluate_readiness.outcome == 'failure' && 'Could not produce structured PR readiness evidence.')
          || '' }}
    env:
      PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.number }}
      PR_BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
      PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      REQUEST_COMMENT_ID: ${{ needs.resolve.outputs.request_comment_id }}
      SESSION_KEY: repo-${{ github.repository_id }}-pr-${{ needs.resolve.outputs.number }}-v2
      SESSION_ARTIFACT_PREFIX: openai-pr-review-session-v2-${{ github.repository_id }}-pr-${{ needs.resolve.outputs.number }}-
      SESSION_ARTIFACT_NAME: openai-pr-review-session-v2-${{ github.repository_id }}-pr-${{ needs.resolve.outputs.number }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - name: Initialize PR review session paths
        run: |
          {
            echo "CODEX_HOME=$RUNNER_TEMP/openai-pr-review-codex-home"
            echo "SESSION_DOWNLOAD_DIR=$RUNNER_TEMP/openai-pr-review-session-download"
            echo "SESSION_SNAPSHOT_DIR=$RUNNER_TEMP/openai-pr-review-session-snapshot"
            echo "PR_REVIEW_STATE_DIR=$RUNNER_TEMP/openai-pr-review-state"
            echo "PR_DIFF_REPOSITORY=$RUNNER_TEMP/openai-pr-review-diff.git"
            echo "REVIEWER_SOURCE_DIR=$GITHUB_WORKSPACE/.openai-pr-review-workflow-source"
          } >> "$GITHUB_ENV"

      - name: Check out trusted pull-request base commit
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the exact reusable reviewer implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .openai-pr-review-workflow-source
          sparse-checkout: |
            .github/scripts/issue-review
            .github/scripts/pr-readiness
            .github/scripts/pr-review
          persist-credentials: false

      - name: Fetch exact pull-request objects without checking out its code
        id: fetch_head
        env:
          REVIEW_HEAD_REF: refs/remotes/openai-pr-review/pr-${{ needs.resolve.outputs.number }}-head
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --bare "$PR_DIFF_REPOSITORY"
          git --git-dir="$PR_DIFF_REPOSITORY" remote add origin \
            "$(git remote get-url origin)"
          basic_auth="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
          if ! git --git-dir="$PR_DIFF_REPOSITORY" \
            -c "http.extraheader=AUTHORIZATION: basic $basic_auth" \
            fetch --no-tags origin \
            "+$PR_BASE_SHA:refs/openai-pr-review/base" \
            "+refs/pull/$PULL_REQUEST_NUMBER/head:$REVIEW_HEAD_REF"
          then
            reason="Could not fetch the exact pull-request base and head objects."
            echo "failure_reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::error title=PR object fetch failed::$reason"
            exit 1
          fi
          fetched_sha="$(git --git-dir="$PR_DIFF_REPOSITORY" \
            rev-parse "$REVIEW_HEAD_REF^{commit}")"
          fetched_base_sha="$(git --git-dir="$PR_DIFF_REPOSITORY" \
            rev-parse "refs/openai-pr-review/base^{commit}")"
          if [ "$fetched_base_sha" != "$PR_BASE_SHA" ]; then
            reason="Fetched pull-request base $fetched_base_sha does not match requested base $PR_BASE_SHA."
            echo "failure_reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::error title=PR base changed::$reason"
            exit 1
          fi
          if [ "$fetched_sha" != "$PR_HEAD_SHA" ]; then
            reason="Fetched pull-request head $fetched_sha does not match requested head $PR_HEAD_SHA."
            echo "failure_reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::error title=PR head changed::$reason"
            exit 1
          fi

      - name: Collect untrusted pull-request discussion context
        id: context
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_CONTEXT_FILE: ${{ runner.temp }}/openai-pr-${{ needs.resolve.outputs.number }}-context.json
        with:
          script: |
            const fs = require('node:fs');
            const clip = (value, length) => String(value ?? '').slice(0, length);
            try {
              const data = await github.graphql(`
                query(
                  $owner: String!,
                  $repo: String!,
                  $number: Int!
                ) {
                  repository(owner: $owner, name: $repo) {
                    nameWithOwner
                    pullRequest(number: $number) {
                      title
                      body
                      closingIssuesReferences(first: 20) {
                        totalCount
                        nodes {
                          repository { nameWithOwner }
                          number
                          title
                          body
                          state
                          issueType { name }
                          parent { number }
                          subIssues(first: 100) {
                            totalCount
                            nodes {
                              repository { nameWithOwner }
                              number
                              state
                            }
                          }
                        }
                      }
                      reviewThreads(first: 100) {
                        pageInfo { hasNextPage }
                        nodes {
                          isResolved
                          comments(first: 1) {
                            nodes {
                              author { login }
                              body
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: Number(process.env.PULL_REQUEST_NUMBER),
              });
              const pullRequest = data.repository.pullRequest;
              if (!pullRequest) throw new Error('Pull request was not found');
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: Number(process.env.PULL_REQUEST_NUMBER), per_page: 100,
              });
              const discussion = {
                repository: data.repository.nameWithOwner,
                pull_request: {
                  title: clip(pullRequest.title, 500),
                  body: clip(pullRequest.body, 80_000),
                  body_truncated:
                    String(pullRequest.body ?? '').length > 80_000,
                },
                linked_issue_count:
                  pullRequest.closingIssuesReferences.totalCount,
                linked_issues: pullRequest.closingIssuesReferences.nodes
                  .slice(0, 10)
                  .map((issue) => ({
                    repository: issue.repository.nameWithOwner,
                    number: issue.number,
                    title: clip(issue.title, 500),
                    body: clip(issue.body, 80_000),
                    body_truncated:
                      String(issue.body ?? '').length > 80_000,
                    state: issue.state,
                    issue_type: issue.issueType?.name || '',
                    parent_number: issue.parent?.number ?? null,
                    sub_issue_count: issue.subIssues.totalCount,
                    sub_issue_numbers: issue.subIssues.nodes.map(
                      (subIssue) => subIssue.number,
                    ),
                    sub_issues: issue.subIssues.nodes.map((subIssue) => ({
                      repository: subIssue.repository.nameWithOwner,
                      number: subIssue.number,
                      state: subIssue.state,
                    })),
                  })),
                unresolved_openai_thread_count: pullRequest.reviewThreads.nodes
                  .filter((thread) => (
                    !thread.isResolved
                    && thread.comments.nodes[0]?.author?.login
                      === 'github-actions[bot]'
                    && /Badge\]\(https:\/\/img\.shields\.io\/badge\/P[0-3]-/
                      .test(thread.comments.nodes[0]?.body || '')
                  ))
                  .length,
                review_threads_truncated:
                  pullRequest.reviewThreads.pageInfo.hasNextPage,
                trigger_comment_id: process.env.REQUEST_COMMENT_ID || null,
                comments: comments.slice(-20).map((comment) => ({
                  author: comment.user.login, association: comment.author_association,
                  created_at: comment.created_at, body: clip(comment.body, 600),
                })),
              };
              fs.writeFileSync(process.env.PR_CONTEXT_FILE, JSON.stringify(discussion), 'utf8');
              core.exportVariable('PR_CONTEXT_FILE', process.env.PR_CONTEXT_FILE);
            } catch (error) {
              const detail = String(error?.message ?? error)
                .replace(/\s+/g, ' ')
                .slice(0, 500);
              const reason = `Could not read the pull-request discussion context: ${detail}`;
              core.setOutput('failure_reason', reason);
              core.setFailed(reason);
            }

      - name: Prepare deterministic PR and Issue readiness context
        id: prepare_readiness
        env:
          PR_READINESS_INSTRUCTIONS: >-
            ${{ inputs.issue-review-instructions }}
            ${{ inputs.pr-readiness-instructions }}
        run: >-
          node
          "$REVIEWER_SOURCE_DIR/.github/scripts/pr-readiness/prepare.mjs"

      - name: Require OpenAI API key
        id: api_key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error title=Missing OPENAI_API_KEY::Pass the required OPENAI_API_KEY organization secret explicitly from the calling workflow."
            echo "failure_reason=The calling repository did not provide its required OPENAI_API_KEY secret." >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Find latest PR review session
        id: find_session
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SESSION_ARTIFACT_PREFIX: ${{ env.SESSION_ARTIFACT_PREFIX }}
          LEGACY_SESSION_ARTIFACT_PREFIX: openai-pr-review-session-v1-${{ github.repository_id }}-pr-${{ needs.resolve.outputs.number }}-
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const latest = artifacts
              .filter((artifact) => (
                (
                  artifact.name.startsWith(process.env.SESSION_ARTIFACT_PREFIX)
                  || artifact.name.startsWith(process.env.LEGACY_SESSION_ARTIFACT_PREFIX)
                )
                && !artifact.expired
              ))
              .sort((left, right) => (
                Date.parse(right.created_at) - Date.parse(left.created_at)
              ))[0];
            core.setOutput('found', String(Boolean(latest)));
            core.setOutput('artifact_id', latest ? String(latest.id) : '');
            core.setOutput(
              'run_id',
              latest?.workflow_run?.id ? String(latest.workflow_run.id) : '',
            );

      - name: Download latest PR review session
        id: download_session
        if: steps.find_session.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ steps.find_session.outputs.artifact_id }}
          path: ${{ env.SESSION_DOWNLOAD_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find_session.outputs.run_id }}
          merge-multiple: true

      - name: Restore and validate PR review session
        id: restore_session
        continue-on-error: true
        env:
          EXPECTED_ARTIFACT_ID: ${{ steps.find_session.outputs.artifact_id }}
          EXPECTED_CODEX_VERSION: ${{ inputs.codex-version }}
          EXPECTED_MODEL: ${{ inputs.model }}
          EXPECTED_EFFORT: ${{ inputs.effort }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REVIEW_INSTRUCTIONS: >-
            ${{ inputs.review-instructions }}
            ${{ inputs.issue-review-instructions }}
            ${{ inputs.pr-readiness-instructions }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const output = (name, value) => {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          };
          const compare = (left, right) => Buffer.compare(
            Buffer.from(left, 'utf8'),
            Buffer.from(right, 'utf8'),
          );
          const treeHash = (root) => {
            const files = [];
            const walk = (directory) => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const absolute = path.join(directory, entry.name);
                if (entry.isDirectory()) walk(absolute);
                else if (entry.isFile()) files.push(absolute);
              }
            };
            walk(root);
            files.sort((left, right) => compare(
              path.relative(root, left).split(path.sep).join('/'),
              path.relative(root, right).split(path.sep).join('/'),
            ));
            const hash = crypto.createHash('sha256');
            for (const file of files) {
              hash.update(path.relative(root, file).split(path.sep).join('/'));
              hash.update('\0');
              hash.update(fs.readFileSync(file));
              hash.update('\0');
            }
            return hash.digest('hex');
          };
          const coldStart = (reason) => {
            if (reason) process.stdout.write(`::warning title=Session restore skipped::${reason}\n`);
            output('resumed', 'false');
            output('session_id', '');
            output('previous_artifact_id', '');
          };

          const manifestPath = path.join(
            process.env.SESSION_DOWNLOAD_DIR,
            'manifest.json',
          );
          const sessionPath = path.join(
            process.env.SESSION_DOWNLOAD_DIR,
            'session.jsonl',
          );
          if (!fs.existsSync(manifestPath) || !fs.existsSync(sessionPath)) {
            coldStart(process.env.EXPECTED_ARTIFACT_ID
              ? 'The latest artifact was unavailable or incomplete; starting a new session.'
              : '');
            process.exit(0);
          }

          try {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const expected = {
              repository_id: String(process.env.REPOSITORY_ID),
              pull_request: Number(process.env.PULL_REQUEST_NUMBER),
              model: process.env.EXPECTED_MODEL,
              effort: process.env.EXPECTED_EFFORT,
              codex_version: process.env.EXPECTED_CODEX_VERSION,
              review_instructions_sha256: crypto
                .createHash('sha256')
                .update(process.env.REVIEW_INSTRUCTIONS)
                .digest('hex'),
            };
            if (![1, 2].includes(Number(manifest.schema_version))) {
              throw new Error('manifest schema_version is unsupported');
            }
            for (const [key, value] of Object.entries(expected)) {
              if (String(manifest[key]) !== String(value)) {
                throw new Error(`manifest ${key} does not match`);
              }
            }
            if (!/^[0-9a-f-]{36}$/i.test(String(manifest.session_id))) {
              throw new Error('manifest session_id is invalid');
            }
            if (!/^sessions\/\d{4}\/\d{2}\/\d{2}\/[^/]+\.jsonl$/.test(
              String(manifest.session_relative_path),
            )) {
              throw new Error('manifest session path is invalid');
            }
            const sessionHash = crypto
              .createHash('sha256')
              .update(fs.readFileSync(sessionPath))
              .digest('hex');
            if (sessionHash !== manifest.session_sha256) {
              throw new Error('session SHA-256 does not match');
            }

            const firstLines = fs.readFileSync(sessionPath, 'utf8')
              .split('\n', 8);
            const metadata = firstLines
              .filter(Boolean)
              .map((line) => JSON.parse(line))
              .find((item) => item.type === 'session_meta');
            if (metadata?.payload?.id !== manifest.session_id) {
              throw new Error('session metadata ID does not match');
            }
            const downloadedState = path.join(
              process.env.SESSION_DOWNLOAD_DIR,
              'state',
            );
            if (Number(manifest.schema_version) === 2) {
              if (!fs.existsSync(downloadedState)) {
                throw new Error('v2 state directory is missing');
              }
              if (treeHash(downloadedState) !== manifest.state_sha256) {
                throw new Error('state SHA-256 does not match');
              }
              fs.cpSync(downloadedState, process.env.PR_REVIEW_STATE_DIR, {
                recursive: true,
                force: true,
              });
            }

            const destination = path.join(
              process.env.CODEX_HOME,
              manifest.session_relative_path,
            );
            fs.mkdirSync(path.dirname(destination), { recursive: true, mode: 0o700 });
            fs.copyFileSync(sessionPath, destination);
            fs.chmodSync(destination, 0o600);
            output('resumed', 'true');
            output('session_id', manifest.session_id);
            output('previous_artifact_id', process.env.EXPECTED_ARTIFACT_ID);
          } catch (error) {
            coldStart(
              `The latest artifact failed validation (${String(error.message).slice(0, 300)}); starting a new session.`,
            );
          }
          NODE

      - name: Prepare deterministic incremental diff listing
        id: prepare_diff
        env:
          REPOSITORY_DIR: ${{ env.PR_DIFF_REPOSITORY }}
          MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
          CHUNK_TARGET_BYTES: ${{ inputs.chunk-target-bytes }}
          READINESS_CONTEXT_SHA256: ${{ steps.prepare_readiness.outputs.context_sha256 }}
        run: node "$REVIEWER_SOURCE_DIR/.github/scripts/pr-review/prepare.mjs"

      - name: Remove fetched pull-request Git objects
        run: |
          case "$PR_DIFF_REPOSITORY" in
            "$RUNNER_TEMP"/openai-pr-review-diff.git)
              rm -rf -- "$PR_DIFF_REPOSITORY"
              ;;
            *)
              echo "::error title=Unsafe temporary path::Refusing to remove $PR_DIFF_REPOSITORY"
              exit 1
              ;;
          esac

      - name: Bootstrap Codex and its protected API proxy
        id: codex_bootstrap
        if: steps.prepare_diff.outputs.reused != 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-users: '*'
          codex-version: ${{ inputs.codex-version }}
          codex-home: ${{ env.CODEX_HOME }}
          permission-profile: :read-only
          safety-strategy: drop-sudo

      - name: Review pending diff chunks in the PR session
        id: run_review
        continue-on-error: true
        env:
          REPOSITORY_DIR: ${{ github.workspace }}
          REVIEW_OUTPUT_SCHEMA: ${{ env.REVIEWER_SOURCE_DIR }}/.github/scripts/pr-review/review-output-schema.json
          STAGE_OUTPUT_SCHEMA: ${{ env.REVIEWER_SOURCE_DIR }}/.github/scripts/pr-review/stage-output-schema.json
          GENERATION_KEY: ${{ steps.prepare_diff.outputs.generation_key }}
          GENERATION_REUSED: ${{ steps.prepare_diff.outputs.reused }}
          RESUMED_SESSION_ID: ${{ steps.restore_session.outputs.session_id }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          REVIEW_INSTRUCTIONS: ${{ inputs.review-instructions }}
          ISSUE_REVIEW_INSTRUCTIONS: ${{ inputs.issue-review-instructions }}
          PR_REVIEW_INSTRUCTIONS: ${{ inputs.pr-readiness-instructions }}
        run: node "$REVIEWER_SOURCE_DIR/.github/scripts/pr-review/run.mjs"

      - name: Evaluate structured PR readiness
        id: evaluate_readiness
        if: steps.run_review.outcome == 'success'
        continue-on-error: true
        env:
          REVIEW: ${{ steps.run_review.outputs.review }}
          WORKFLOW_SOURCE_SHA: ${{ job.workflow_sha }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
        run: >-
          node
          "$REVIEWER_SOURCE_DIR/.github/scripts/pr-readiness/evaluate.mjs"

      - name: Confirm PR head before saving session
        id: session_head
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PULL_REQUEST_NUMBER),
            });
            core.setOutput(
              'current',
              String(pullRequest.head.sha === process.env.PR_HEAD_SHA),
            );

      - name: Prepare PR review session snapshot
        id: prepare_session
        if: steps.session_head.outputs.current == 'true'
        continue-on-error: true
        env:
          CODEX_VERSION: ${{ inputs.codex-version }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          REPOSITORY_ID: ${{ github.repository_id }}
          WORKFLOW_SOURCE_SHA: ${{ job.workflow_sha }}
          REVIEW_INSTRUCTIONS: >-
            ${{ inputs.review-instructions }}
            ${{ inputs.issue-review-instructions }}
            ${{ inputs.pr-readiness-instructions }}
          PREVIOUS_ARTIFACT_ID: ${{ steps.restore_session.outputs.previous_artifact_id }}
          RESUMED_SESSION_ID: ${{ steps.restore_session.outputs.session_id }}
          GENERATED_SESSION_ID: ${{ steps.run_review.outputs.session_id }}
          SESSION_KEY: ${{ env.SESSION_KEY }}
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const output = (name, value) => {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          };
          const compare = (left, right) => Buffer.compare(
            Buffer.from(left, 'utf8'),
            Buffer.from(right, 'utf8'),
          );
          const treeHash = (root) => {
            const files = [];
            const walk = (directory) => {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const absolute = path.join(directory, entry.name);
                if (entry.isDirectory()) walk(absolute);
                else if (entry.isFile()) files.push(absolute);
              }
            };
            walk(root);
            files.sort((left, right) => compare(
              path.relative(root, left).split(path.sep).join('/'),
              path.relative(root, right).split(path.sep).join('/'),
            ));
            const hash = crypto.createHash('sha256');
            for (const file of files) {
              hash.update(path.relative(root, file).split(path.sep).join('/'));
              hash.update('\0');
              hash.update(fs.readFileSync(file));
              hash.update('\0');
            }
            return hash.digest('hex');
          };
          const sessions = path.join(process.env.CODEX_HOME, 'sessions');
          const ledgerPath = path.join(
            process.env.PR_REVIEW_STATE_DIR,
            'review-ledger.json',
          );
          if (!fs.existsSync(sessions) || !fs.existsSync(ledgerPath)) {
            output('ready', 'false');
            process.exit(0);
          }

          const candidates = fs.readdirSync(sessions, { recursive: true })
            .filter((entry) => String(entry).endsWith('.jsonl'))
            .map((entry) => path.join(sessions, String(entry)))
            .map((file) => {
              let sessionId = '';
              let isSubagent = false;
              for (const line of fs.readFileSync(file, 'utf8').split('\n', 8)) {
                if (!line) continue;
                try {
                  const item = JSON.parse(line);
                  if (item.type === 'session_meta' && item.payload?.id) {
                    sessionId = String(item.payload.id);
                    isSubagent = item.payload.thread_source === 'subagent'
                      || Boolean(item.payload.parent_thread_id);
                    break;
                  }
                } catch {
                  // Continue looking for the session metadata record.
                }
              }
              return {
                file,
                sessionId,
                isSubagent,
                mtimeMs: fs.statSync(file).mtimeMs,
              };
            })
            .filter((candidate) => (
              !candidate.isSubagent
              && /^[0-9a-f-]{36}$/i.test(candidate.sessionId)
            ))
            .sort((left, right) => right.mtimeMs - left.mtimeMs);
          const resumedId = process.env.GENERATED_SESSION_ID
            || process.env.RESUMED_SESSION_ID
            || '';
          const selected = candidates.find(
            (candidate) => candidate.sessionId === resumedId,
          ) || candidates[0];
          if (!selected) {
            output('ready', 'false');
            process.exit(0);
          }

          fs.rmSync(process.env.SESSION_SNAPSHOT_DIR, {
            recursive: true,
            force: true,
          });
          fs.mkdirSync(process.env.SESSION_SNAPSHOT_DIR, {
            recursive: true,
            mode: 0o700,
          });
          const snapshotSession = path.join(
            process.env.SESSION_SNAPSHOT_DIR,
            'session.jsonl',
          );
          fs.copyFileSync(selected.file, snapshotSession);
          fs.chmodSync(snapshotSession, 0o600);
          const snapshotState = path.join(
            process.env.SESSION_SNAPSHOT_DIR,
            'state',
          );
          fs.cpSync(process.env.PR_REVIEW_STATE_DIR, snapshotState, {
            recursive: true,
            force: true,
          });
          const stateSha256 = treeHash(snapshotState);
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          const lastCompleted = ledger.generations
            .filter((generation) => generation.status === 'completed')
            .at(-1);
          const sessionSha256 = crypto
            .createHash('sha256')
            .update(fs.readFileSync(snapshotSession))
            .digest('hex');
          const relativePath = path.relative(
            process.env.CODEX_HOME,
            selected.file,
          ).split(path.sep).join('/');
          if (!/^sessions\/\d{4}\/\d{2}\/\d{2}\/[^/]+\.jsonl$/.test(relativePath)) {
            throw new Error(`Unexpected Codex session path: ${relativePath}`);
          }
          const manifest = {
            schema_version: 2,
            repository_id: String(process.env.REPOSITORY_ID),
            repository: process.env.GITHUB_REPOSITORY,
            pull_request: Number(process.env.PULL_REQUEST_NUMBER),
            session_key: process.env.SESSION_KEY,
            session_id: selected.sessionId,
            session_relative_path: relativePath,
            session_sha256: sessionSha256,
            session_bytes: fs.statSync(snapshotSession).size,
            state_sha256: stateSha256,
            last_completed_head: lastCompleted?.to_sha || null,
            in_progress_head: lastCompleted?.to_sha === process.env.PR_HEAD_SHA
              ? null
              : process.env.PR_HEAD_SHA,
            model: process.env.MODEL,
            effort: process.env.EFFORT,
            codex_version: process.env.CODEX_VERSION,
            workflow_source_sha: process.env.WORKFLOW_SOURCE_SHA,
            review_instructions_sha256: crypto
              .createHash('sha256')
              .update(process.env.REVIEW_INSTRUCTIONS)
              .digest('hex'),
            source_run_id: process.env.GITHUB_RUN_ID,
            source_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            previous_artifact_id: process.env.PREVIOUS_ARTIFACT_ID || null,
            created_at: new Date().toISOString(),
          };
          fs.writeFileSync(
            path.join(process.env.SESSION_SNAPSHOT_DIR, 'manifest.json'),
            `${JSON.stringify(manifest, null, 2)}\n`,
            { mode: 0o600 },
          );
          output('ready', 'true');
          output('session_id', selected.sessionId);
          output('session_bytes', String(manifest.session_bytes));
          NODE

      - name: Upload updated PR review session
        id: upload_session
        if: steps.prepare_session.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.SESSION_ARTIFACT_NAME }}
          path: |
            ${{ env.SESSION_SNAPSHOT_DIR }}/manifest.json
            ${{ env.SESSION_SNAPSHOT_DIR }}/session.jsonl
            ${{ env.SESSION_SNAPSHOT_DIR }}/state
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Delete superseded PR review sessions
        if: steps.upload_session.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          NEW_ARTIFACT_ID: ${{ steps.upload_session.outputs.artifact-id }}
          SESSION_ARTIFACT_PREFIX: ${{ env.SESSION_ARTIFACT_PREFIX }}
          LEGACY_SESSION_ARTIFACT_PREFIX: openai-pr-review-session-v1-${{ github.repository_id }}-pr-${{ needs.resolve.outputs.number }}-
        with:
          script: |
            const newArtifactId = Number(process.env.NEW_ARTIFACT_ID);
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const superseded = artifacts.filter((artifact) => (
              (
                artifact.name.startsWith(process.env.SESSION_ARTIFACT_PREFIX)
                || artifact.name.startsWith(process.env.LEGACY_SESSION_ARTIFACT_PREFIX)
              )
              && artifact.id !== newArtifactId
            ));
            for (const artifact of superseded) {
              let deleted = false;
              for (let attempt = 1; attempt <= 3 && !deleted; attempt += 1) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  deleted = true;
                } catch (error) {
                  if (attempt === 3) {
                    core.warning(
                      `Could not delete superseded session artifact ${artifact.id}: ${error.message}`,
                    );
                  }
                }
              }
            }

      - name: Fail after saving an incomplete review checkpoint
        if: >-
          steps.run_review.outcome == 'failure'
          || steps.evaluate_readiness.outcome == 'failure'
        env:
          FAILURE_REASON: >-
            ${{ steps.run_review.outputs.failure_reason
              || 'Could not produce structured PR readiness evidence.' }}
        run: |
          echo "::error title=OpenAI PR review failed::$FAILURE_REASON"
          exit 1

  publish:
    needs: [resolve, review]
    if: github.run_attempt == 1 && needs.review.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    outputs:
      failure_reason: >-
        ${{ (steps.verify_identity.outcome == 'failure'
              && 'PR or linked-Issue readiness identity changed before publication.')
          || steps.publish.outputs.failure_reason
          || (steps.publish.outcome == 'failure' && 'GitHub could not publish the generated pull-request review.')
          || '' }}
    steps:
      - name: Check out exact readiness identity verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .openai-pr-readiness-workflow-source
          sparse-checkout: |
            .github/scripts/issue-review
            .github/scripts/pr-readiness
          persist-credentials: false

      - name: Revalidate current PR readiness identity
        id: verify_identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.number }}
          REQUEST_COMMENT_ID: ${{ needs.resolve.outputs.request_comment_id }}
          EXPECTED_SNAPSHOT_SHA256: >-
            ${{ fromJSON(needs.review.outputs.readiness_evidence).snapshot_sha256 }}
        run: >-
          node
          .openai-pr-readiness-workflow-source/.github/scripts/pr-readiness/verify.mjs

      - name: Publish native pull-request review
        id: publish
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REVIEW: ${{ needs.review.outputs.review }}
          READINESS_EVIDENCE: ${{ needs.review.outputs.readiness_evidence }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          DURATION_SECONDS: ${{ needs.review.outputs.duration_seconds }}
          USAGE_AVAILABLE: ${{ needs.review.outputs.usage_available }}
          INPUT_TOKENS: ${{ needs.review.outputs.input_tokens }}
          CACHED_INPUT_TOKENS: ${{ needs.review.outputs.cached_input_tokens }}
          CACHE_WRITE_TOKENS: ${{ needs.review.outputs.cache_write_tokens }}
          CACHE_HIT_RATIO: ${{ needs.review.outputs.cache_hit_ratio }}
          OUTPUT_TOKENS: ${{ needs.review.outputs.output_tokens }}
          REASONING_OUTPUT_TOKENS: ${{ needs.review.outputs.reasoning_output_tokens }}
          TOTAL_TOKENS: ${{ needs.review.outputs.total_tokens }}
          CREDITS_AVAILABLE: ${{ needs.review.outputs.credits_available }}
          ESTIMATED_CREDITS: ${{ needs.review.outputs.estimated_credits }}
          CREDIT_RATES_JSON: ${{ needs.review.outputs.credit_rates_json }}
          USAGE_JSON: ${{ needs.review.outputs.usage_json }}
          SESSION_KEY: ${{ needs.review.outputs.session_key }}
          GENERATION_KEY: ${{ needs.review.outputs.generation_key }}
          REVIEW_FROM_SHA: ${{ needs.review.outputs.from_sha }}
          REVIEW_MODE: ${{ needs.review.outputs.review_mode }}
          CHUNK_COUNT: ${{ needs.review.outputs.chunk_count }}
          PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.number }}
          PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        with:
          script: |
            const maxCommentLength = 60_000;
            const maxFindingLength = 12_000;
            const review = JSON.parse(process.env.REVIEW);
            const readiness = JSON.parse(process.env.READINESS_EVIDENCE);
            const count = (value) => Number(value || 0).toLocaleString('en-US');
            const duration = (value) => {
              const seconds = Math.max(0, Number(value || 0));
              const minutes = Math.floor(seconds / 60);
              const remainder = seconds % 60;
              return minutes === 0
                ? `${remainder}s`
                : `${minutes}m ${remainder}s`;
            };
            const code = (value) => {
              const text = String(value);
              const delimiter = '`'.repeat(Math.max(
                1,
                ...Array.from(text.matchAll(/`+/g), (match) => match[0].length + 1),
              ));
              return `${delimiter}${text}${delimiter}`;
            };
            const pullNumber = Number(process.env.PULL_REQUEST_NUMBER);
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            if (pullRequest.head.sha !== process.env.PR_HEAD_SHA) {
              const reason = 'Pull-request head changed while the review was running; the stale review was not published.';
              core.setOutput('failure_reason', reason);
              core.setFailed(reason);
              return;
            }

            const badge = {
              P0: 'red', P1: 'orange', P2: 'yellow', P3: 'blue',
            };
            const formatFinding = (finding) => [
              `**<sub><sub>![${finding.priority} Badge](https://img.shields.io/badge/${finding.priority}-${badge[finding.priority]}?style=flat)</sub></sub> ${String(finding.title).slice(0, 240)}**`,
              String(finding.body).slice(0, maxFindingLength),
              'Useful? React with 👍 / 👎.',
            ].join('\n\n');
            const inlineFindings = [];
            const summaryFindings = [];
            for (const finding of review.findings) {
              if (finding.inline_safe === true) {
                inlineFindings.push({
                  path: finding.path,
                  line: finding.line,
                  side: 'RIGHT',
                  body: formatFinding(finding),
                });
              } else {
                summaryFindings.push(finding);
              }
            }

            const fallback = summaryFindings.length === 0
              ? ''
              : [
                  '### Findings without a safe inline location',
                  ...summaryFindings.map((finding) => [
                    `- ${code(finding.priority)} ${code(finding.path)}:${finding.line} — ${String(finding.title).slice(0, 240)}`,
                    `  ${String(finding.body).slice(0, 2_000).replaceAll('\n', '\n  ')}`,
                  ].join('\n')),
                ].join('\n\n');
            const findingCount = inlineFindings.length + summaryFindings.length;
            const blockerCount = readiness.blockers.length;
            const overallPass = readiness.verdict === 'pass' && findingCount === 0;
            const conclusion = overallPass
              ? '# ✅ OpenAI PR Review: PASS'
              : '# ❌ OpenAI PR Review: FAIL';
            const failureReasons = [
              blockerCount > 0
                ? `${blockerCount} readiness blocker${blockerCount === 1 ? '' : 's'}`
                : '',
              findingCount > 0
                ? `${findingCount} actionable finding${findingCount === 1 ? '' : 's'}`
                : '',
            ].filter(Boolean);
            const conclusionDetail = overallPass
              ? '> **Conclusion:** Ready from the OpenAI review perspective. PR format, linked Issue design, and code/plan conformance passed with no actionable findings.'
              : `> **Conclusion:** Not ready. ${failureReasons.join(' and ') || 'Review requirements'} must be resolved before merge.`;
            const stageVerdict = (value) => (
              value === 'pass' ? '✅ PASS' : '❌ FAIL'
            );
            const readinessDetails = [
              '## Review checks',
              '| Check | Result |',
              '| --- | :---: |',
              `| PR format | ${stageVerdict(readiness.stage_verdicts.pr_review)} |`,
              `| Issue design | ${stageVerdict(readiness.stage_verdicts.issue_review)} |`,
              `| Code & plan conformance | ${stageVerdict(readiness.stage_verdicts.code_review)} |`,
            ].join('\n');
            const blockerDetails = blockerCount === 0
              ? ''
              : [
                  '## Blockers',
                  ...readiness.blockers.slice(0, 25).map((blocker) => (
                    `- **${code(blocker.source)}** ${String(blocker.message).slice(0, 2_000)}`
                  )),
                ].join('\n');
            let usageDetails = '';
            try {
              const usageData = JSON.parse(process.env.USAGE_JSON || '{}');
              const turns = Array.isArray(usageData.turns) ? usageData.turns : [];
              if (turns.length > 0) {
                const target = (turn) => {
                  if (turn.issue_number != null) return `Issue #${turn.issue_number}`;
                  const key = String(turn.key || '');
                  if (key.includes('deterministic')) return 'format rules';
                  if (key.includes('aggregate')) return 'aggregate';
                  const chunk = key.match(/chunk:(\d+)(?:\/(\d+))?/);
                  if (chunk) return `chunk ${chunk[1]}${chunk[2] ? `/${chunk[2]}` : ''}`;
                  if (turn.mode === 'reused') return 'cached evidence';
                  return String(turn.stage || 'review');
                };
                usageDetails = [
                  '<details>',
                  '<summary>Token and cache details</summary>',
                  '',
                  '| Stage | Mode | Target | Time | Input | Cached | Hit | Output | Total | Credits |',
                  '| --- | --- | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |',
                  ...turns.map((turn) => {
                    const hit = Number(turn.cache_hit_ratio || 0) * 100;
                    const credits = turn.estimated_credits;
                    return [
                      `| ${code(String(turn.stage || 'unknown').slice(0, 30))}`,
                      code(String(turn.mode || 'unknown').slice(0, 30)),
                      code(target(turn)),
                      duration(turn.duration_seconds),
                      count(turn.input_tokens),
                      count(turn.cached_input_tokens),
                      `${hit.toFixed(1)}%`,
                      count(turn.output_tokens),
                      count(turn.total_tokens),
                      `${
                        credits === null || credits === undefined
                          ? 'N/A'
                          : Number(credits).toFixed(3)
                      } |`,
                    ].join(' | ');
                  }),
                  '',
                  '</details>',
                ].join('\n');
              }
            } catch {
              usageDetails = '';
            }
            let creditRate = '';
            try {
              const rates = JSON.parse(process.env.CREDIT_RATES_JSON || '{}');
              if (
                Number.isFinite(Number(rates.input))
                && Number.isFinite(Number(rates.cached_input))
                && Number.isFinite(Number(rates.output))
              ) {
                creditRate = [
                  '- Credit rate per 1M tokens:',
                  `${code(count(rates.input))} input /`,
                  `${code(count(rates.cached_input))} cached /`,
                  `${code(count(rates.output))} output`,
                ].join(' ');
              }
            } catch {
              creditRate = '';
            }
            const usageSummary = process.env.USAGE_AVAILABLE === 'true'
              ? [
                  `**Usage:** ${code(duration(process.env.DURATION_SECONDS))}`,
                  `${code(count(process.env.TOTAL_TOKENS))} tokens`,
                  `${code(process.env.CACHE_HIT_RATIO)} cache hit`,
                  process.env.CREDITS_AVAILABLE === 'true'
                    ? `${code(process.env.ESTIMATED_CREDITS)} credits`
                    : 'credits unavailable',
                ].join(' · ')
              : `**Usage:** ${code(duration(process.env.DURATION_SECONDS))} · tokens unavailable`;
            const usageTotals = process.env.USAGE_AVAILABLE === 'true'
              ? [
                  '**Totals**',
                  '',
                  `- Input: ${code(count(process.env.INPUT_TOKENS))}`,
                  `- Cached input: ${code(count(process.env.CACHED_INPUT_TOKENS))}`,
                  `- Cache write: ${code(count(process.env.CACHE_WRITE_TOKENS))}`,
                  `- Output: ${code(count(process.env.OUTPUT_TOKENS))}`,
                  `- Reasoning: ${code(count(process.env.REASONING_OUTPUT_TOKENS))}`,
                  `- Total: ${code(count(process.env.TOTAL_TOKENS))}`,
                  process.env.CREDITS_AVAILABLE === 'true'
                    ? `- Estimated credits: ${code(process.env.ESTIMATED_CREDITS)}`
                    : '- Estimated credits: unavailable for this model',
                  ...(creditRate ? [creditRate] : []),
                ].join('\n')
              : '';
            const metadataDetails = [
              '<details>',
              '<summary>Review metadata</summary>',
              '',
              `- Commit: ${code(process.env.PR_HEAD_SHA.slice(0, 10))}`,
              `- Range: ${code(`${process.env.REVIEW_FROM_SHA.slice(0, 10)}..${process.env.PR_HEAD_SHA.slice(0, 10)}`)}`,
              `- Mode: ${code(process.env.REVIEW_MODE)}`,
              `- Diff chunks: ${code(process.env.CHUNK_COUNT)}`,
              `- Model: ${code(process.env.MODEL)}`,
              `- Reasoning effort: ${code(process.env.EFFORT)}`,
              `- Session: ${code(process.env.SESSION_KEY)}`,
              `- Generation: ${code(process.env.GENERATION_KEY)}`,
              `- Evidence: ${code(readiness.snapshot_sha256)}`,
              ...(usageTotals ? ['', usageTotals] : []),
              '',
              '</details>',
            ].join('\n');
            const scope = [
              `**Scope:** ${code(process.env.PR_HEAD_SHA.slice(0, 10))}`,
              code(`${process.env.REVIEW_FROM_SHA.slice(0, 10)}..${process.env.PR_HEAD_SHA.slice(0, 10)}`),
              code(process.env.REVIEW_MODE),
              `${code(process.env.CHUNK_COUNT)} diff chunk${process.env.CHUNK_COUNT === '1' ? '' : 's'}`,
            ].join(' · ');
            const findingDetails = findingCount === 0
              ? ''
              : [
                  '## Findings',
                  `${inlineFindings.length} inline finding${inlineFindings.length === 1 ? '' : 's'} published.`,
                ].join('\n\n');
            let body = [
              conclusion,
              conclusionDetail,
              readinessDetails,
              scope,
              usageSummary,
              blockerDetails,
              findingDetails,
              '## Summary',
              String(review.summary).slice(0, 12_000),
              metadataDetails,
              usageDetails,
              fallback,
            ].filter(Boolean).join('\n\n');
            if (body.length > maxCommentLength) body = `${body.slice(0, maxCommentLength - 16)}\n\n[Truncated]`;

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              commit_id: process.env.PR_HEAD_SHA,
              event: 'COMMENT',
              body,
              comments: inlineFindings,
            });

  finalize:
    needs: [resolve, start, review, publish]
    if: always() && github.run_attempt == 1 && needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      issues: write
      pull-requests: write
    steps:
      - name: Record review result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_CHECK_RUN_ID: ${{ needs.start.outputs.pr_check_run_id }}
          ISSUE_CHECK_RUN_ID: ${{ needs.start.outputs.issue_check_run_id }}
          CODE_CHECK_RUN_ID: ${{ needs.start.outputs.code_check_run_id }}
          READINESS_EVIDENCE: ${{ needs.review.outputs.readiness_evidence }}
          PULL_REQUEST_NUMBER: ${{ needs.resolve.outputs.number }}
          REQUEST_COMMENT_ID: ${{ needs.resolve.outputs.request_comment_id }}
          REQUEST_REACTION_ID: ${{ needs.start.outputs.request_reaction_id }}
          START_RESULT: ${{ needs.start.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          START_FAILURE_REASON: ${{ needs.start.outputs.failure_reason }}
          REVIEW_FAILURE_REASON: ${{ needs.review.outputs.failure_reason }}
          PUBLISH_FAILURE_REASON: ${{ needs.publish.outputs.failure_reason }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const results = [
              process.env.START_RESULT,
              process.env.REVIEW_RESULT,
              process.env.PUBLISH_RESULT,
            ];
            const cancelled = results.includes('cancelled');
            const executionSucceeded = results.every(
              (result) => result === 'success',
            );
            const failureReason = [
              process.env.START_FAILURE_REASON,
              process.env.REVIEW_FAILURE_REASON,
              process.env.PUBLISH_FAILURE_REASON,
            ].find(Boolean);
            const safeFailureReason = String(
              failureReason || 'The workflow stopped unexpectedly before reporting a more specific reason.',
            )
              .replace(/\s+/g, ' ')
              .replaceAll('@', '@\u200b')
              .slice(0, 1_000);
            let readiness;
            try {
              readiness = JSON.parse(process.env.READINESS_EVIDENCE || '{}');
            } catch {
              readiness = {};
            }
            const blockers = Array.isArray(readiness.blockers)
              ? readiness.blockers
              : [];
            const overallConclusion = cancelled
              ? 'cancelled'
              : executionSucceeded && readiness.verdict === 'pass'
                ? 'success'
                : 'failure';
            const checks = [
              {
                id: process.env.PR_CHECK_RUN_ID,
                name: 'OpenAI PR Review',
                verdict: readiness.stage_verdicts?.pr_review,
                sources: new Set(['pr-format', 'pr-linkage', 'review-thread']),
              },
              {
                id: process.env.ISSUE_CHECK_RUN_ID,
                name: 'OpenAI Issue Review',
                verdict: readiness.stage_verdicts?.issue_review,
                sources: new Set(['issue-format', 'issue-design']),
              },
              {
                id: process.env.CODE_CHECK_RUN_ID,
                name: 'OpenAI Code Review',
                verdict: readiness.stage_verdicts?.code_review,
                sources: new Set(['code-review', 'plan-conformance']),
              },
            ];
            const checkUpdates = [];
            for (const check of checks) {
              const checkRunId = Number(check.id);
              if (!Number.isSafeInteger(checkRunId) || checkRunId < 1) continue;
              const conclusion = cancelled
                ? 'cancelled'
                : executionSucceeded && check.verdict === 'pass'
                  ? 'success'
                  : 'failure';
              const stageBlockers = blockers.filter(
                (blocker) => check.sources.has(blocker.source),
              );
              const resultSummary = conclusion === 'success'
                ? `${check.name} found no configured blockers. This is not a pull-request approval.`
                : conclusion === 'cancelled'
                  ? 'This review was superseded or cancelled.'
                  : executionSucceeded && stageBlockers.length > 0
                    ? [
                        `Found ${stageBlockers.length} blocker${stageBlockers.length === 1 ? '' : 's'}:`,
                        ...stageBlockers.slice(0, 25).map((blocker) => (
                          `- **${String(blocker.source).slice(0, 80)}:** ${String(blocker.message).replaceAll('@', '@\u200b').slice(0, 1_000)}`
                        )),
                      ].join('\n')
                    : `**Reason:** ${safeFailureReason}`;
              const summary = [
                resultSummary,
                `[Open the Actions run](${process.env.DETAILS_URL}).`,
              ].join('\n\n');
              checkUpdates.push(github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: checkRunId,
                status: 'completed',
                conclusion,
                completed_at: new Date().toISOString(),
                output: {
                  title: {
                    success: 'Review passed',
                    cancelled: 'Review cancelled',
                    failure: executionSucceeded
                      ? 'Review blocked'
                      : 'Review completed with an error',
                  }[conclusion],
                  summary: summary.slice(0, 65_000),
                },
              }));
            }
            const updateResults = await Promise.allSettled(checkUpdates);
            const failedUpdate = updateResults.find(
              (result) => result.status === 'rejected',
            );
            if (failedUpdate) {
              core.setFailed(
                `Could not finalize every OpenAI Check: ${String(failedUpdate.reason?.message ?? failedUpdate.reason).slice(0, 500)}`,
              );
            }

            if (!executionSucceeded && !cancelled) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.PULL_REQUEST_NUMBER),
                body: [
                  '## 🤖 OpenAI PR review completed with an error',
                  `**Reason:** ${safeFailureReason}`,
                  `[Open the Actions run](${process.env.DETAILS_URL}).`,
                ].join('\n\n'),
              });
            }

            const commentId = Number(process.env.REQUEST_COMMENT_ID);
            if (!Number.isSafeInteger(commentId) || commentId < 1) return;

            const reactionId = Number(process.env.REQUEST_REACTION_ID);
            if (Number.isSafeInteger(reactionId) && reactionId > 0) {
              await github.request(
                'DELETE /repos/{owner}/{repo}/issues/comments/{comment_id}/reactions/{reaction_id}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: commentId,
                  reaction_id: reactionId,
                },
              );
            }

            const reactions = await github.paginate(
              github.rest.reactions.listForIssueComment,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                per_page: 100,
              },
            );
            const managedReactions = new Set([
              'eyes',
              'rocket',
              'confused',
              '-1',
            ]);
            for (const reaction of reactions) {
              if (
                managedReactions.has(reaction.content)
                && reaction.user?.login === 'github-actions[bot]'
              ) {
                await github.request(
                  'DELETE /repos/{owner}/{repo}/issues/comments/{comment_id}/reactions/{reaction_id}',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: commentId,
                    reaction_id: reaction.id,
                  },
                );
              }
            }

            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              content: {
                success: 'rocket',
                cancelled: 'confused',
                failure: 'rocket',
              }[overallConclusion],
            });
